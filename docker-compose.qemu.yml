version: '3.8'
services:
  manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.qemu
    container_name: silicon-manager
    volumes:
      - ./linux-emulator-server:/workspaces/linux-emulator-server:rw
      - ./images:/workspaces/images:rw
      - /var/log/silicon-emulator:/var/log/silicon-emulator:rw
    ports:
      - "8080:8080"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/kvm:/dev/kvm
    restart: unless-stopped
