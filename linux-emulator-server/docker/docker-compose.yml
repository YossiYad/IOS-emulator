version: '3.8'

services:
  # QEMU iOS Emulator Backend + VNC Server
  qemu-ios-emulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: qemu-ios-emulator
    image: qemu-ios-emulator:latest
    
    # Enable KVM for hardware acceleration (requires --device /dev/kvm)
    devices:
      - /dev/kvm:/dev/kvm
    
    # Required for nested virtualization in some environments
    privileged: false
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    
    ports:
      - "5900:5900"   # VNC display
      - "2222:22"     # SSH tunnel
      - "3000:3000"   # Web UI
      - "8080:80"     # HTTP
      - "3001:3001"   # Backend API
    
    environment:
      - VNC_DISPLAY=:1
      - VNC_PASSWORD=${VNC_PASSWORD:-qemu-ios}
      - AUTO_START=false
      - LOG_LEVEL=info
      - QEMU_AUDIO_DRV=none
    
    volumes:
      # Persistent storage for disk images and firmware
      - qemu-storage:/var/lib/silicon-emulator
      - qemu-firmware:/usr/share/qemu/edk2-aarch64
      - qemu-ios:/usr/share/qemu/ios-firmware
      
      # Configuration
      - ./configs:/etc/silicon-emulator
      - ./src/scripts:/app/scripts:ro
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Startup command: setup firmware + run backend
    command: >
      /bin/sh -c "
        echo 'Starting QEMU iOS Emulator...' &&
        bash /app/scripts/download-edk2-firmware.sh &&
        bash /app/scripts/download-ios-image.sh &&
        bash /app/scripts/setup-ios-qemu.sh &&
        /app/bin/qemu-ios-emulator
      "
    
    restart: unless-stopped
    networks:
      - qemu-network

  # Optional: Nginx reverse proxy for remote access
  nginx:
    image: nginx:alpine
    container_name: qemu-ios-proxy
    ports:
      - "8000:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - qemu-ios-emulator
    networks:
      - qemu-network
    restart: unless-stopped

networks:
  qemu-network:
    driver: bridge

volumes:
  qemu-storage:
    driver: local
  qemu-firmware:
    driver: local
  qemu-ios:
    driver: local