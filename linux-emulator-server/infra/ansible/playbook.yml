- hosts: localhost
  become: yes
  tasks:
    - name: Install required packages
      apt:
        name:
          - qemu
          - qemu-system-x86
          - x11vnc
          - xvfb
        state: present

    - name: Clone the emulator repository
      git:
        repo: 'https://github.com/yourusername/linux-emulator.git'
        dest: /opt/linux-emulator
        version: main

    - name: Run the installation script
      command: /opt/linux-emulator/src/scripts/install-emulator.sh

    - name: Setup VNC server
      command: /opt/linux-emulator/src/scripts/setup-vnc.sh

    - name: Start the emulator
      command: /opt/linux-emulator/src/scripts/start-emulator.sh

    - name: Ensure VNC server is running
      service:
        name: x11vnc
        state: started
        enabled: yes

    - name: Create systemd service for the emulator
      copy:
        dest: /etc/systemd/system/linux-emulator.service
        content: |
          [Unit]
          Description=Linux Emulator Service
          After=network.target

          [Service]
          ExecStart=/opt/linux-emulator/src/scripts/start-emulator.sh
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start the emulator service
      systemd:
        name: linux-emulator
        enabled: yes
        state: started